<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Student Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    background: linear-gradient(120deg,#2980b9,#6dd5fa);
    min-height:100vh;
}

.container-box{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.table td, .table th{
    vertical-align:middle;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="container-box">

<h2 class="text-center text-primary mb-4">
<i class="fa-solid fa-user-graduate"></i>
Student Management System
</h2>

<div id="alertBox"></div>

<div class="row mb-3">

<div class="col-md-6">
<label class="form-label">Search by name</label>
<input type="text" id="searchName" class="form-control" placeholder="Enter name...">
</div>

<div class="col-md-6">
<label class="form-label">Search by ID</label>
<div class="input-group">
<input type="number" id="searchID" class="form-control">
<button class="btn btn-secondary" onclick="searchByID()">
<i class="fa fa-search"></i>
</button>
</div>
</div>

</div>

<table class="table table-hover table-bordered">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th width="150">Action</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>

</table>

<hr>

<h4 id="formTitle">Add new student</h4>

<input type="hidden" id="studentId">

<input id="name" class="form-control mb-2" placeholder="Student name">

<input id="email" class="form-control mb-3" placeholder="Email">

<div id="actionButtons">
<button class="btn btn-primary" onclick="addStudent()">
<i class="fa fa-plus"></i> Add
</button>
</div>

</div>
</div>

<script>

const API = "http://localhost:8080/api/students"

function showAlert(message,type="success"){
document.getElementById("alertBox").innerHTML=
`<div class="alert alert-${type} alert-dismissible fade show">
${message}
<button class="btn-close" data-bs-dismiss="alert"></button>
</div>`
}

function validate(name,email){

if(!name || !email){
showAlert("Please enter full information","danger")
return false
}

const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/

if(!emailRegex.test(email)){
showAlert("Invalid email format","danger")
return false
}

return true
}

async function loadStudents(){

try{

const res=await fetch(API)
const data=await res.json()

renderTable(data)

}catch(err){
showAlert("Cannot load student list","danger")
}

}

function renderTable(data){

let html=""

const list=Array.isArray(data)?data:[data]

list.forEach(s=>{

if(!s) return

html+=`

<tr>

<td>${s.id}</td>
<td>${s.name}</td>
<td>${s.email}</td>

<td>

<button class="btn btn-warning btn-sm me-1"
onclick="editStudent(${s.id},'${s.name}','${s.email}')">

<i class="fa fa-pen"></i>

</button>

<button class="btn btn-danger btn-sm"
onclick="deleteStudent(${s.id})">

<i class="fa fa-trash"></i>

</button>

</td>

</tr>

`

})

document.getElementById("studentTable").innerHTML=html

}

async function addStudent(){

const name=document.getElementById("name").value
const email=document.getElementById("email").value

if(!validate(name,email)) return

await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,email})
})

showAlert("Student added successfully")

clearForm()
loadStudents()

}

async function deleteStudent(id){

if(!confirm("Delete this student?")) return

await fetch(`${API}/delete/${id}`,{method:"POST"})

showAlert("Deleted successfully","warning")

loadStudents()

}

function editStudent(id,name,email){

document.getElementById("studentId").value=id
document.getElementById("name").value=name
document.getElementById("email").value=email

document.getElementById("formTitle").innerText=`Update student ID: ${id}`

document.getElementById("actionButtons").innerHTML=`

<button class="btn btn-success" onclick="saveUpdate()">
<i class="fa fa-save"></i> Save
</button>

<button class="btn btn-secondary" onclick="clearForm()">
Cancel
</button>

`

}

async function saveUpdate(){

const id=document.getElementById("studentId").value
const name=document.getElementById("name").value
const email=document.getElementById("email").value

if(!validate(name,email)) return

await fetch(`${API}/update/${id}`,{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,email})

})

showAlert("Updated successfully")

clearForm()
loadStudents()

}

async function searchByID(){

const id=document.getElementById("searchID").value

if(!id){
loadStudents()
return
}

try{

const res=await fetch(`${API}/${id}`)
const data=await res.json()

renderTable(data)

}catch{

showAlert("Student not found","danger")

}

}

document.getElementById("searchName").addEventListener("keyup",async e=>{

const name=e.target.value

const res=await fetch(`${API}/search?name=${name}`)
const data=await res.json()

renderTable(data)

})

function clearForm(){

document.getElementById("studentId").value=""
document.getElementById("name").value=""
document.getElementById("email").value=""

document.getElementById("formTitle").innerText="Add new student"

document.getElementById("actionButtons").innerHTML=
`<button class="btn btn-primary" onclick="addStudent()">
<i class="fa fa-plus"></i> Add
</button>`

}

loadStudents()

</script>

</body>
</html>
