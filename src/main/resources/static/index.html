<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hệ thống Quản lý Học sinh - School Manager 10">
    <title>School Manager | Quản Lý Học Sinh</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --success: #10b981;
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --bg-card-alt: #334155;
            --bg-input: #0f172a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --glow: rgba(99, 102, 241, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
            padding: 2.5rem 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            animation: headerPulse 6s ease-in-out infinite;
        }

        @keyframes headerPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }

        .header h1 i {
            margin-right: 0.5rem;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.85;
            margin-top: 0.3rem;
            position: relative;
            z-index: 1;
        }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            max-width: 960px;
            margin: -2rem auto 3rem;
            padding: 0 1rem;
            position: relative;
            z-index: 2;
        }

        /* ===== CARD ===== */
        .card-custom {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
            transition: box-shadow 0.3s ease;
        }

        .card-custom:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--glow);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title i {
            color: var(--primary);
            font-size: 1.25rem;
        }

        /* ===== FORM ===== */
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .form-control:focus {
            background: var(--bg-input);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--glow);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: #475569;
        }

        .btn-primary-custom {
            background: var(--primary);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.7rem 1.5rem;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-primary-custom:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
            color: #fff;
        }

        .btn-cancel {
            background: var(--bg-card-alt);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-weight: 600;
            border-radius: 10px;
            padding: 0.7rem 1.5rem;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            display: none;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-cancel:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
        }

        /* ===== SEARCH ===== */
        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 1rem;
        }

        .search-box input {
            padding-left: 2.5rem;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .table-custom {
            margin-bottom: 0;
            color: var(--text-primary);
        }

        .table-custom thead {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
        }

        .table-custom thead th {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 0.9rem 1rem;
            border: none;
            color: #fff;
        }

        .table-custom tbody tr {
            transition: background 0.2s ease;
            border-bottom: 1px solid var(--border);
        }

        .table-custom tbody tr:hover {
            background: rgba(99, 102, 241, 0.06);
        }

        .table-custom tbody td {
            padding: 0.85rem 1rem;
            vertical-align: middle;
            font-size: 0.93rem;
            border: none;
        }

        .table-custom tbody tr:last-child {
            border-bottom: none;
        }

        /* ===== ACTION BUTTONS ===== */
        .btn-action {
            border: none;
            border-radius: 8px;
            padding: 0.4rem 0.75rem;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-edit {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .btn-edit:hover {
            background: var(--warning);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
            transform: translateY(-1px);
        }

        /* ===== BADGE / STATS ===== */
        .stat-badge {
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
        }

        .toast-custom {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            animation: toastSlideIn 0.35s ease;
            margin-bottom: 0.5rem;
        }

        .toast-custom.success { border-left: 4px solid var(--success); }
        .toast-custom.error   { border-left: 4px solid var(--danger);  }
        .toast-custom.info    { border-left: 4px solid var(--primary); }

        @keyframes toastSlideIn {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        /* ===== LOADING SPINNER ===== */
        .spinner-wrapper {
            text-align: center;
            padding: 2rem;
        }

        .spinner-wrapper .spinner-border {
            color: var(--primary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 576px) {
            .header h1 { font-size: 1.5rem; }
            .card-custom { padding: 1.25rem; }
            .main-container { margin-top: -1rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1><i class="bi bi-mortarboard-fill"></i> School Manager</h1>
        <p>Hệ thống Quản lý Học sinh — schoolmanager10</p>
    </header>

    <!-- MAIN -->
    <main class="main-container">

        <!-- FORM CARD -->
        <section class="card-custom" id="form-card">
            <h2 class="card-title">
                <i class="bi bi-person-plus-fill"></i>
                <span id="form-title">Thêm Học Sinh Mới</span>
            </h2>

            <form id="student-form" autocomplete="off">
                <input type="hidden" id="student-id">
                <div class="row g-3">
                    <div class="col-md-5">
                        <label for="student-name" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="student-name"
                               placeholder="Nhập họ tên học sinh..." required>
                    </div>
                    <div class="col-md-5">
                        <label for="student-email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="student-email"
                               placeholder="Nhập địa chỉ email..." required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary-custom w-100" id="btn-submit">
                            <i class="bi bi-plus-lg"></i> <span id="btn-submit-text">Thêm</span>
                        </button>
                    </div>
                    <div class="col-12">
                        <button type="button" class="btn btn-cancel" id="btn-cancel" onclick="cancelEdit()">
                            <i class="bi bi-x-lg"></i> Hủy chỉnh sửa
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- TABLE CARD -->
        <section class="card-custom">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 class="card-title mb-0">
                    <i class="bi bi-people-fill"></i>
                    Danh Sách Học Sinh
                    <span class="stat-badge" id="student-count">
                        <i class="bi bi-hash"></i> 0
                    </span>
                </h2>
                <div class="search-box" style="min-width: 240px;">
                    <i class="bi bi-search"></i>
                    <input type="text" class="form-control" id="search-input"
                           placeholder="Tìm theo tên..." oninput="handleSearch()">
                </div>
            </div>

            <div class="table-wrapper">
                <table class="table table-custom" id="student-table">
                    <thead>
                        <tr>
                            <th style="width: 60px;">#</th>
                            <th>Họ và Tên</th>
                            <th>Email</th>
                            <th style="width: 170px; text-align: center;">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody id="student-tbody">
                        <!-- Rows rendered by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Empty state -->
            <div class="empty-state d-none" id="empty-state">
                <i class="bi bi-inbox"></i>
                <p>Chưa có học sinh nào. Hãy thêm học sinh đầu tiên!</p>
            </div>

            <!-- Loading spinner -->
            <div class="spinner-wrapper d-none" id="loading-spinner">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Đang tải...</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ============================================
        // CẤU HÌNH
        // ============================================
        const API_BASE = '/api/students';

        // ============================================
        // TRẠNG THÁI
        // ============================================
        let isEditMode = false;
        let editingId = null;
        let searchTimeout = null;

        // ============================================
        // KHỞI TẠO
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadStudents();
            document.getElementById('student-form').addEventListener('submit', handleSubmit);
        });

        // ============================================
        // TẢI DANH SÁCH HỌC SINH
        // ============================================
        async function loadStudents() {
            showLoading(true);
            try {
                const res = await fetch(API_BASE);
                if (!res.ok) throw new Error('Lỗi tải dữ liệu');
                const students = await res.json();
                renderTable(students);
            } catch (err) {
                showToast('Không thể tải danh sách: ' + err.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // ============================================
        // TÌM KIẾM
        // ============================================
        function handleSearch() {
            clearTimeout(searchTimeout);
            const keyword = document.getElementById('search-input').value.trim();

            searchTimeout = setTimeout(async () => {
                if (keyword === '') {
                    loadStudents();
                    return;
                }
                showLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/search?name=${encodeURIComponent(keyword)}`);
                    if (!res.ok) throw new Error('Lỗi tìm kiếm');
                    const students = await res.json();
                    renderTable(students);
                } catch (err) {
                    showToast('Lỗi tìm kiếm: ' + err.message, 'error');
                } finally {
                    showLoading(false);
                }
            }, 350);
        }

        // ============================================
        // XỬ LÝ SUBMIT FORM (THÊM / CẬP NHẬT)
        // ============================================
        async function handleSubmit(e) {
            e.preventDefault();

            const name  = document.getElementById('student-name').value.trim();
            const email = document.getElementById('student-email').value.trim();

            if (!name || !email) {
                showToast('Vui lòng nhập đầy đủ Tên và Email!', 'error');
                return;
            }

            const payload = { name, email };

            try {
                let res;
                if (isEditMode && editingId !== null) {
                    // CẬP NHẬT
                    res = await fetch(`${API_BASE}/update/${editingId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error('Lỗi cập nhật');
                    showToast('Cập nhật học sinh thành công!', 'success');
                    cancelEdit();
                } else {
                    // THÊM MỚI
                    res = await fetch(API_BASE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error('Lỗi thêm mới');
                    showToast('Thêm học sinh thành công!', 'success');
                }

                document.getElementById('student-form').reset();
                loadStudents();

            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ============================================
        // XÓA HỌC SINH
        // ============================================
        async function deleteStudent(id, name) {
            if (!confirm(`Bạn chắc chắn muốn xóa học sinh "${name}"?`)) return;

            try {
                const res = await fetch(`${API_BASE}/delete/${id}`, { method: 'POST' });
                if (!res.ok) throw new Error('Lỗi xóa');
                showToast(`Đã xóa học sinh "${name}"`, 'success');
                loadStudents();
            } catch (err) {
                showToast('Không thể xóa: ' + err.message, 'error');
            }
        }

        // ============================================
        // SỬA HỌC SINH (ĐỔ DỮ LIỆU LÊN FORM)
        // ============================================
        function editStudent(id, name, email) {
            isEditMode = true;
            editingId  = id;

            document.getElementById('student-id').value    = id;
            document.getElementById('student-name').value  = name;
            document.getElementById('student-email').value = email;

            // Đổi giao diện form sang chế độ "Cập nhật"
            document.getElementById('form-title').textContent       = 'Chỉnh Sửa Học Sinh (ID: ' + id + ')';
            document.getElementById('btn-submit-text').textContent  = 'Cập nhật';
            document.getElementById('btn-submit').classList.add('btn-warning-custom');
            document.getElementById('btn-cancel').style.display     = 'inline-flex';

            // Cuộn lên form
            document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('student-name').focus();
        }

        // ============================================
        // HỦY CHỈNH SỬA
        // ============================================
        function cancelEdit() {
            isEditMode = false;
            editingId  = null;

            document.getElementById('student-form').reset();
            document.getElementById('student-id').value = '';

            document.getElementById('form-title').textContent       = 'Thêm Học Sinh Mới';
            document.getElementById('btn-submit-text').textContent  = 'Thêm';
            document.getElementById('btn-submit').classList.remove('btn-warning-custom');
            document.getElementById('btn-cancel').style.display     = 'none';
        }

        // ============================================
        // RENDER BẢNG
        // ============================================
        function renderTable(students) {
            const tbody = document.getElementById('student-tbody');
            const emptyState = document.getElementById('empty-state');
            const countBadge = document.getElementById('student-count');

            countBadge.innerHTML = `<i class="bi bi-hash"></i> ${students.length}`;

            if (students.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('d-none');
                return;
            }

            emptyState.classList.add('d-none');

            tbody.innerHTML = students.map((s, index) => `
                <tr>
                    <td style="color: var(--text-secondary); font-weight: 600;">${index + 1}</td>
                    <td style="font-weight: 500;">${escapeHtml(s.name)}</td>
                    <td style="color: var(--text-secondary);">${escapeHtml(s.email)}</td>
                    <td style="text-align: center;">
                        <button class="btn-action btn-edit me-1"
                                onclick="editStudent(${s.id}, '${escapeJs(s.name)}', '${escapeJs(s.email)}')"
                                title="Chỉnh sửa">
                            <i class="bi bi-pencil-square"></i> Sửa
                        </button>
                        <button class="btn-action btn-delete"
                                onclick="deleteStudent(${s.id}, '${escapeJs(s.name)}')"
                                title="Xóa">
                            <i class="bi bi-trash3"></i> Xóa
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // ============================================
        // HIỂN THỊ TOAST THÔNG BÁO
        // ============================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const iconMap = {
                success: 'bi-check-circle-fill',
                error:   'bi-exclamation-triangle-fill',
                info:    'bi-info-circle-fill'
            };

            const toast = document.createElement('div');
            toast.className = `toast-custom ${type}`;
            toast.innerHTML = `<i class="bi ${iconMap[type] || iconMap.info}"></i> ${message}`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================
        // TIỆN ÍCH
        // ============================================
        function showLoading(show) {
            document.getElementById('loading-spinner').classList.toggle('d-none', !show);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function escapeJs(str) {
            return (str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
